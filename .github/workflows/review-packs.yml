name: Generate public Reel Review Packs
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  repository_dispatch:
    types: [reference_ready]
  workflow_dispatch:
    inputs:
      reference_id:
        description: Optional Reference Lab ID; blank scans all references
        required: false
        type: string
  push:
    paths: ['processor/**', '*-tests.py', 'browser-qa.py', 'bootstrap*.zip', '.github/workflows/review-packs.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: review-packs
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'tuffgroup/mohaned-reel-review-packs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REFERENCE_ID: ${{ github.event.client_payload.reference_id || inputs.reference_id || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the locally generated backfill without regenerating frames or PDFs
        run: |
          for archive in bootstrap*.zip; do
            if [ -f "$archive" ]; then unzip -n -q "$archive"; fi
          done
      - name: Install free local video and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet --no-cache-dir reportlab==4.4.3 Pillow==11.3.0
      - name: Verify new video and update behavior with synthetic media
        if: github.event_name != 'schedule'
        run: python processor-tests.py
      - name: Poll all source records and generate only stale packs
        run: |
          args=()
          if [ -n "$REFERENCE_ID" ]; then args+=(--reference-id "$REFERENCE_ID"); fi
          python processor/sync.py "${args[@]}"
      - name: Store static files and factual polling status
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch processor/__pycache__
          git add docs processor/*.py
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stored Review Packs and daily source check'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request free branch-based Pages publication
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/tuffgroup/mohaned-reel-review-packs/pages/builds/latest --jq .status)
          if [ '${{ steps.publish.outputs.changed }}' = 'true' ] || [ '${{ github.event_name }}' = 'workflow_dispatch' ] || [ "$status" = 'errored' ]; then
            gh api --method POST repos/tuffgroup/mohaned-reel-review-packs/pages/builds --silent
          fi
      - name: Verify the public Site with a fresh anonymous browser
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet --no-cache-dir playwright==1.55.0
          python -m playwright install --with-deps chromium
          python browser-qa.py
