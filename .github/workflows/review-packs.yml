name: Generate public Reel Review Packs
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths: ['processor/**', 'bootstrap*.zip', '.github/workflows/review-packs.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: review-packs
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'tuffgroup/mohaned-reel-review-packs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore the locally generated backfill without regenerating frames or PDFs
        run: |
          for archive in bootstrap*.zip; do
            if [ -f "$archive" ]; then unzip -n -q "$archive"; fi
          done
      - name: Install free local video and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet --no-cache-dir reportlab==4.4.3 Pillow==11.3.0
      - name: Poll all source records and generate only stale packs
        run: python processor/sync.py
      - name: Store static files and factual polling status
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs processor
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stored Review Packs and daily source check'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request free branch-based Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/tuffgroup/mohaned-reel-review-packs/pages/builds/latest --jq .status)
          if [ '${{ steps.publish.outputs.changed }}' = 'true' ] || [ '${{ github.event_name }}' = 'workflow_dispatch' ] || [ "$status" = 'errored' ]; then
            gh api --method POST repos/tuffgroup/mohaned-reel-review-packs/pages/builds --silent
          fi
